<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TVDE Gest — Gestão de Frota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  --bg:#16181B;
  --bg-panel:#1F2226;
  --bg-elevated:#282C31;
  --bg-hover:#31363C;
  --line:#383D44;
  --text:#EDEEF0;
  --text-dim:#9BA1AA;
  --text-faint:#666C75;
  --uber:#5B7CFA;
  --uber-dim:#5B7CFA33;
  --bolt:#33D19B;
  --bolt-dim:#33D19B2E;
  --warn:#F2994A;
  --danger:#F25C54;
  --radius:10px;
  --font-display:'Barlow Condensed',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--uber-dim); color:var(--text);}
a{color:inherit;}

/* ---------- layout ---------- */
.app{display:flex; min-height:100vh;}

.sidebar{
  width:220px; flex-shrink:0;
  background:var(--bg-panel);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column;
  padding:20px 14px;
  position:sticky; top:0; height:100vh;
}
.brand{
  display:flex; align-items:baseline; gap:8px;
  padding:6px 8px 22px 8px;
}
.brand-mark{
  width:10px; height:10px; border-radius:2px;
  background:linear-gradient(135deg,var(--uber),var(--bolt));
  transform:rotate(45deg);
}
.brand-name{
  font-family:var(--font-display); font-weight:700; font-size:22px;
  letter-spacing:0.3px;
}
.brand-sub{font-size:10px; color:var(--text-faint); letter-spacing:1.5px; text-transform:uppercase; margin-left:2px;}

nav{display:flex; flex-direction:column; gap:2px; margin-top:8px;}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; border-radius:8px;
  font-size:14px; font-weight:500; color:var(--text-dim);
  cursor:pointer; border:none; background:none; text-align:left; width:100%;
  transition:background .12s, color .12s;
  font-family:var(--font-body);
}
.nav-item svg{width:16px; height:16px; flex-shrink:0; opacity:.85;}
.nav-item:hover{background:var(--bg-hover); color:var(--text);}
.nav-item.active{background:var(--bg-elevated); color:var(--text);}
.nav-item.active .dot{opacity:1;}

.sidebar-foot{
  margin-top:auto; padding:10px 8px;
  font-size:11px; color:var(--text-faint);
  border-top:1px solid var(--line); padding-top:14px;
}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 32px; border-bottom:1px solid var(--line);
  background:var(--bg);
}
.topbar h1{font-family:var(--font-display); font-weight:600; font-size:26px; letter-spacing:.2px;}
.topbar-meta{font-size:12px; color:var(--text-faint); font-family:var(--font-mono);}

.content{padding:28px 32px 60px 32px; width:100%; max-width:none;}

/* ---------- generic components ---------- */
.card{
  background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px;
}
.grid{display:grid; gap:16px;}
.kpi-grid{grid-template-columns:repeat(4,minmax(180px,1fr)); margin-bottom:20px;}
@media (max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}

.kpi{
  background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 18px; position:relative; overflow:hidden;
}
.kpi-label{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-faint); margin-bottom:8px;}
.kpi-value{font-family:var(--font-mono); font-size:28px; font-weight:600; font-variant-numeric:tabular-nums;}
.kpi-sub{font-size:12px; color:var(--text-dim); margin-top:6px;}
.kpi.uber{border-top:2px solid var(--uber);}
.kpi.bolt{border-top:2px solid var(--bolt);}

.section-title{
  font-family:var(--font-display); font-weight:600; font-size:19px;
  margin:28px 0 12px 0; letter-spacing:.2px;
}
.section-title:first-child{margin-top:0;}

.pill{
  display:inline-flex; align-items:center; gap:5px;
  font-size:11px; font-weight:600; padding:3px 9px; border-radius:99px;
  text-transform:uppercase; letter-spacing:.4px;
}
.pill.uber{background:var(--uber-dim); color:var(--uber);}
.pill.bolt{background:var(--bolt-dim); color:var(--bolt);}
.pill.ativo{background:#33D19B2E; color:var(--bolt);}
.pill.manutencao{background:#F2994A2E; color:var(--warn);}
.pill.parado{background:#F25C542E; color:var(--danger);}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.6px;
  color:var(--text-faint); font-weight:600; padding:10px 12px; border-bottom:1px solid var(--line);
}
td{padding:11px 12px; border-bottom:1px solid var(--line); color:var(--text);}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--bg-hover);}
.num{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
.table-wrap{background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
.table-empty{padding:40px 20px; text-align:center; color:var(--text-faint); font-size:13.5px;}

button.btn{
  font-family:var(--font-body); font-weight:600; font-size:13px;
  padding:9px 16px; border-radius:8px; border:1px solid var(--line);
  background:var(--bg-elevated); color:var(--text); cursor:pointer;
  transition:background .12s, border-color .12s;
}
button.btn:hover{background:var(--bg-hover); border-color:#4a5058;}
button.btn.primary{background:var(--text); color:var(--bg); border-color:var(--text);}
button.btn.primary:hover{opacity:.9;}
button.btn.danger{color:var(--danger); border-color:#F25C5444;}
button.btn.small{padding:5px 10px; font-size:12px;}
button.icon-btn{
  background:none; border:none; color:var(--text-faint); cursor:pointer; padding:4px;
  border-radius:6px; display:inline-flex;
}
button.icon-btn:hover{color:var(--text); background:var(--bg-hover);}

.toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
.toolbar-left{display:flex; gap:8px; align-items:center;}
.tabs{display:flex; gap:4px; background:var(--bg-panel); border:1px solid var(--line); border-radius:8px; padding:3px;}
.tab{padding:6px 14px; border-radius:6px; font-size:13px; font-weight:500; color:var(--text-dim); cursor:pointer;}
.tab.active{background:var(--bg-elevated); color:var(--text);}

/* modal */
.overlay{
  position:fixed; inset:0; background:#0A0B0Ccc; backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.modal{
  background:var(--bg-panel); border:1px solid var(--line); border-radius:12px;
  width:100%; max-width:460px; padding:22px; max-height:88vh; overflow-y:auto;
}
.modal h3{font-family:var(--font-display); font-weight:600; font-size:20px; margin-bottom:16px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:5px; font-weight:500;}
.field input, .field select, .field textarea{
  width:100%; background:var(--bg); border:1px solid var(--line); border-radius:7px;
  padding:9px 10px; color:var(--text); font-size:13.5px; font-family:var(--font-body);
}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--uber);}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}

.route-hero{
  position:relative; height:34px; margin-bottom:22px; overflow:hidden;
}
.route-hero svg{width:100%; height:100%;}
.route-dash{stroke-dasharray:6 7; animation:dashmove 3.5s linear infinite;}
@keyframes dashmove{to{stroke-dashoffset:-52;}}

.empty-state{
  text-align:center; padding:50px 20px; color:var(--text-faint);
}
.empty-state svg{width:34px; height:34px; margin-bottom:10px; opacity:.5;}
.empty-state p{font-size:13.5px; margin-bottom:14px;}

.info-card{
  background:var(--bg-elevated); border:1px solid var(--line); border-left:3px solid var(--uber);
  border-radius:8px; padding:16px 18px; font-size:13px; color:var(--text-dim); line-height:1.6;
  margin-bottom:18px;
}
.info-card b{color:var(--text);}
.info-card a{color:var(--uber); text-decoration:underline; text-underline-offset:2px;}

.csv-drop{
  border:1.5px dashed var(--line); border-radius:10px; padding:34px 20px; text-align:center;
  color:var(--text-dim); font-size:13.5px; cursor:pointer; transition:border-color .12s, background .12s;
}
.csv-drop:hover{border-color:var(--uber); background:var(--bg-elevated);}
.csv-drop.drag{border-color:var(--bolt); background:var(--bg-elevated);}

.mini-bar-row{display:flex; align-items:center; gap:10px; font-size:12px; margin-bottom:8px;}
.mini-bar-label{width:70px; color:var(--text-dim); flex-shrink:0; font-family:var(--font-mono);}
.mini-bar-track{flex:1; height:8px; background:var(--bg); border-radius:4px; overflow:hidden; display:flex;}
.mini-bar-fill{height:100%;}
.mini-bar-value{width:70px; text-align:right; font-family:var(--font-mono); color:var(--text-dim); flex-shrink:0;}

.badge-dot{width:6px; height:6px; border-radius:50%; display:inline-block; margin-right:6px;}

.hidden{display:none !important;}
.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  background:var(--text); color:var(--bg); padding:10px 18px; border-radius:8px;
  font-size:13px; font-weight:600; z-index:200; box-shadow:0 8px 24px #0006;
}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px;}
::-webkit-scrollbar-track{background:transparent;}

/* ===== TVDE GEST 1.0 — IDENTIDADE VISUAL ===== */
:root{
  --bg:#f4f7fb;
  --bg-panel:#ffffff;
  --bg-elevated:#f8fafc;
  --bg-hover:#eef4f8;
  --line:#dfe7ee;
  --text:#102a36;
  --text-dim:#5f7480;
  --text-faint:#8ea0aa;
  --uber:#276ef1;
  --uber-dim:#eaf1ff;
  --bolt:#0b9f78;
  --bolt-dim:#e5f8f2;
  --warn:#d67b17;
  --danger:#d84949;
  --radius:16px;
  --font-display:'Inter',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --navy:#0d2b36;
  --navy-2:#123945;
  --accent:#31c59a;
  --shadow:0 12px 34px rgba(15,42,54,.08);
}
body{background:radial-gradient(circle at 78% -10%,rgba(49,197,154,.12),transparent 30%),var(--bg);color:var(--text);}
.app{min-height:100vh;}
.sidebar{
  width:258px;padding:22px 16px 18px;background:linear-gradient(180deg,var(--navy),#0a222b 100%);
  border-right:0;box-shadow:12px 0 40px rgba(13,43,54,.10);z-index:10;
}
.brand{align-items:center;padding:5px 8px 25px;gap:12px;border-bottom:1px solid rgba(255,255,255,.09);margin-bottom:15px;}
.brand-mark{width:38px;height:38px;border-radius:12px;transform:none;background:linear-gradient(145deg,#45d5aa,#2f8ce8);box-shadow:0 8px 24px rgba(49,197,154,.28);position:relative;}
.brand-mark:before{content:'T';position:absolute;inset:0;display:grid;place-items:center;color:white;font-weight:800;font-size:18px;}
.brand-name{font-family:var(--font-body);font-size:20px;color:#fff;letter-spacing:-.4px;}
.brand-sub{font-size:9px;color:#95adb7;letter-spacing:1.25px;margin-top:2px;}
nav{gap:5px;}
.nav-item{padding:11px 12px;border-radius:11px;color:#a9bdc5;font-size:13.5px;transition:.18s ease;}
.nav-item svg{width:18px;height:18px;}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff;transform:translateX(2px);}
.nav-item.active{background:linear-gradient(90deg,rgba(49,197,154,.19),rgba(47,140,232,.10));color:#fff;box-shadow:inset 3px 0 0 var(--accent);}
.sidebar-foot{color:#78939e;border-top:1px solid rgba(255,255,255,.09);line-height:1.55;}
.main{background:transparent;}
.topbar{padding:22px 34px;background:rgba(244,247,251,.82);backdrop-filter:blur(14px);border-bottom:1px solid rgba(213,225,234,.82);position:sticky;top:0;z-index:7;}
.topbar h1{font-family:var(--font-body);font-size:24px;font-weight:750;letter-spacing:-.5px;}
.topbar-meta{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:var(--text-dim);box-shadow:0 3px 12px rgba(15,42,54,.04);}
.content{padding:30px 34px 70px;width:100%;max-width:none;}
.card,.kpi,.table-wrap{background:rgba(255,255,255,.96);border:1px solid rgba(218,229,237,.95);box-shadow:var(--shadow);}
.card{padding:22px;border-radius:18px;}
.kpi{border-radius:18px;padding:19px 20px;transition:transform .18s ease,box-shadow .18s ease;}
.kpi:hover{transform:translateY(-2px);box-shadow:0 16px 38px rgba(15,42,54,.11);}
.kpi:before{content:'';position:absolute;right:-18px;top:-22px;width:86px;height:86px;border-radius:50%;background:linear-gradient(135deg,rgba(39,110,241,.08),rgba(49,197,154,.10));}
.kpi.uber,.kpi.bolt{border-top:1px solid rgba(218,229,237,.95);}
.kpi.uber{box-shadow:inset 0 3px 0 var(--uber),var(--shadow);}
.kpi.bolt{box-shadow:inset 0 3px 0 var(--bolt),var(--shadow);}
.kpi-label{color:var(--text-dim);font-weight:700;letter-spacing:.7px;}
.kpi-value{font-size:27px;letter-spacing:-1px;color:var(--navy);}
.kpi-sub{color:var(--text-faint);}
.section-title{font-family:var(--font-body);font-size:18px;font-weight:750;letter-spacing:-.25px;color:var(--navy);}
.info-card{background:linear-gradient(135deg,#f7fbff,#f3fbf8);border:1px solid #d9eae7;border-left:4px solid var(--accent);border-radius:14px;color:var(--text-dim);box-shadow:0 8px 24px rgba(15,42,54,.05);}
.info-card b{color:var(--navy);}
.info-card a{color:var(--uber);}
button.btn,.btn{border-radius:11px!important;padding:10px 16px!important;border:1px solid var(--line)!important;background:#fff!important;color:var(--navy)!important;box-shadow:0 4px 13px rgba(15,42,54,.05);transition:.18s ease!important;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;}
button.btn:hover,.btn:hover{transform:translateY(-1px);border-color:#bdccd5!important;background:#f9fbfc!important;}
button.btn.primary,.btn.primary{background:linear-gradient(135deg,var(--navy-2),var(--navy))!important;color:#fff!important;border-color:var(--navy)!important;box-shadow:0 8px 20px rgba(13,43,54,.18);}
button.btn.danger{color:var(--danger)!important;border-color:#f0caca!important;background:#fff8f8!important;}
.tabs{background:#eaf0f4;border:0;border-radius:12px;padding:4px;}
.tab{border-radius:9px;padding:7px 16px;}
.tab.active{background:#fff;color:var(--navy);box-shadow:0 3px 10px rgba(15,42,54,.09);}
.table-wrap{border-radius:16px;overflow:hidden;}
th{background:#f7fafc;color:#718692;padding:12px 14px;}
td{padding:13px 14px;border-color:#edf1f4;}
tbody tr:hover{background:#f8fbfc;}
.pill{border-radius:999px;padding:4px 10px;}
.modal{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 80px rgba(13,43,54,.24);padding:26px;}
.overlay{background:rgba(6,25,32,.58);backdrop-filter:blur(6px);}
.field input,.field select,.field textarea{background:#f8fafc;border-color:#dbe5eb;border-radius:10px;color:var(--text);padding:11px 12px;}
.field input:focus,.field select:focus,.field textarea:focus{box-shadow:0 0 0 4px rgba(39,110,241,.10);}
.csv-drop{background:#fbfdfe;border-color:#c9d8e0;border-radius:16px;}
.csv-drop:hover{background:#f4faf8;border-color:var(--accent);}
.mini-bar-track{background:#eaf0f4;height:9px;}
.mini-bar-fill{border-radius:99px;}
.toast{background:var(--navy);color:#fff;border-radius:12px;box-shadow:0 15px 40px rgba(13,43,54,.28);}
::-webkit-scrollbar-thumb{background:#cbd7de;}
.welcome-banner{display:flex;align-items:center;justify-content:space-between;gap:22px;padding:25px 28px;border-radius:22px;margin-bottom:20px;background:linear-gradient(120deg,#0d2b36 0%,#154957 66%,#187a6d 100%);color:#fff;box-shadow:0 18px 44px rgba(13,43,54,.18);overflow:hidden;position:relative;}
.welcome-banner:after{content:'';position:absolute;width:220px;height:220px;border-radius:50%;right:-60px;top:-100px;background:rgba(255,255,255,.07);}
.welcome-banner h2{font-size:22px;letter-spacing:-.5px;margin-bottom:5px;position:relative;z-index:1;}
.welcome-banner p{color:#c7dce3;font-size:13px;position:relative;z-index:1;}
.welcome-badge{position:relative;z-index:1;border:1px solid rgba(255,255,255,.20);background:rgba(255,255,255,.10);padding:10px 14px;border-radius:13px;font-size:12px;white-space:nowrap;}

 .sidebar{width:82px;padding:18px 10px}.brand{justify-content:center}.brand>div:last-child,.nav-item:not(.active)::after,.sidebar-foot{display:none}.nav-item{justify-content:center;padding:12px}.nav-item svg{width:20px;height:20px}.nav-item{font-size:0}.nav-item.active{box-shadow:inset 0 -3px 0 var(--accent)}.content{padding:24px 20px 60px}.topbar{padding:18px 20px}.welcome-banner{align-items:flex-start;flex-direction:column}.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
}

.hero-grid{display:grid;grid-template-columns:1.4fr .6fr;gap:16px;margin-bottom:18px}.hero-card{background:linear-gradient(145deg,#20252b,#181b1f);border:1px solid var(--line);border-radius:16px;padding:24px;position:relative;overflow:hidden}.hero-card:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--bolt-dim),transparent 68%);right:-90px;top:-130px}.hero-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--bolt)}.hero-card h2{font-family:var(--font-display);font-size:34px;margin:7px 0}.hero-card p{color:var(--text-dim);max-width:650px;line-height:1.6}.period-bar{display:flex;gap:6px;flex-wrap:wrap}.period-btn{border:1px solid var(--line);background:var(--bg-panel);color:var(--text-dim);padding:7px 11px;border-radius:8px;cursor:pointer}.period-btn.active{background:var(--text);color:var(--bg)}.platform-split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.platform-box{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg-elevated)}.platform-box strong{display:block;font-family:var(--font-mono);font-size:20px;margin-top:7px}.driver-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.driver-card{background:var(--bg-panel);border:1px solid var(--line);border-radius:13px;padding:16px;cursor:pointer;transition:.16s}.driver-card:hover{transform:translateY(-2px);border-color:#59616c}.driver-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.driver-name{font-weight:700;font-size:15px}.driver-meta{font-size:11px;color:var(--text-faint);margin-top:4px}.driver-money{font-family:var(--font-mono);font-weight:600;font-size:19px;margin:14px 0 4px}.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}.metric-mini{background:var(--bg);border-radius:8px;padding:8px}.metric-mini span{display:block;font-size:10px;color:var(--text-faint);text-transform:uppercase}.metric-mini b{font-size:12px;font-family:var(--font-mono)}.health-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--bolt)}.health-dot.off{background:var(--text-faint)}.mirror-table td:first-child{font-weight:650}.formula-strip{padding:14px 16px;background:linear-gradient(90deg,var(--uber-dim),var(--bolt-dim));border:1px solid var(--line);border-radius:10px;font-size:13px;line-height:1.6}.detail-banner{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.back-link{background:none;border:none;color:var(--text-dim);cursor:pointer}.source-badge{font-size:10px;border-radius:99px;padding:3px 7px;border:1px solid var(--line)}
@media(max-width:1050px){.driver-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.hero-grid,.driver-grid,.platform-split{grid-template-columns:1fr}.content{padding:20px 16px 50px}.topbar{padding:15px 16px}.sidebar{width:72px}.sidebar .brand-name,.sidebar .brand-sub,.sidebar .nav-item{font-size:0}.sidebar .nav-item svg{width:20px;height:20px}.sidebar .nav-item{justify-content:center}.sidebar-foot{display:none}}
.dashboard-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,.7fr);gap:18px;align-items:start}.insights-panel{display:grid;gap:18px}.compact-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.ranking-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.ranking-row>span{width:24px;height:24px;border-radius:8px;background:var(--bolt-dim);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--bolt)}.ranking-row small{display:block;color:var(--text-faint);margin-top:3px}.ranking-row strong{font-family:var(--font-mono)}.status-line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}@media(max-width:1150px){.dashboard-layout{grid-template-columns:1fr}.insights-panel{grid-template-columns:1fr 1fr}}@media(max-width:720px){.compact-kpis,.insights-panel{grid-template-columns:1fr}}</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <div class="brand-name">TVDE Gest</div>
        <div class="brand-sub">Gestão interna de frota TVDE</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">Acesso interno. Credenciais e dados protegidos no Worker/D1.</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="page-title">Painel</h1>
      <div class="topbar-meta" id="topbar-meta">—</div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* ============================================================
   ESTADO E PERSISTÊNCIA
============================================================ */
const STORE_KEYS = { vehicles:'tvde-gest:vehicles', drivers:'tvde-gest:drivers', entries:'tvde-gest:entries', settings:'tvde-gest:settings' };
const todayIso = () => new Date().toISOString().slice(0,10);
const daysAgoIso = (days) => { const d=new Date(); d.setDate(d.getDate()-days); return d.toISOString().slice(0,10); };
const DEFAULT_SETTINGS = {
  moeda:'EUR',
  boltCompanyId:'',
  boltStartDate:daysAgoIso(7),
  boltEndDate:todayIso(),
  uberOrgId:'',
  settlementWeekStart:'',
};
let state = { vehicles: [], drivers: [], entries: [], settings: { ...DEFAULT_SETTINGS }, settlements: [], settlementRules: [], syncRuns: [] };
let currentView = 'painel';
let serverDataAvailable = false;

function uid(){ return globalThis.crypto?.randomUUID?.() || Math.random().toString(36).slice(2)+Date.now().toString(36); }

const storageAdapter = {
  async get(key){
    if(window.storage?.get){
      const result = await window.storage.get(key, false);
      return result?.value ?? null;
    }
    return localStorage.getItem(key);
  },
  async set(key, value){
    if(window.storage?.set) return window.storage.set(key, value, false);
    localStorage.setItem(key, value);
  }
};

async function apiFetch(path, options={}){
  const response=await fetch(path,{...options,headers:{Accept:'application/json',...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});
  const text=await response.text();
  let data={}; try{ data=text?JSON.parse(text):{}; }catch{ data={error:text}; }
  if(!response.ok||data.ok===false) throw new Error(data.error||`Pedido falhou (${response.status}).`);
  return data;
}

async function reloadServerData(showToast=false){
  try{
    const data=await apiFetch('/api/data/snapshot');
    state.drivers=data.drivers||[]; state.vehicles=data.vehicles||[]; state.entries=data.entries||[];
    state.syncRuns=data.syncRuns||[]; serverDataAvailable=true;
    if(showToast) toast('Dados atualizados da base de dados.');
    return true;
  }catch(error){
    serverDataAvailable=false;
    console.warn('D1 indisponível; a usar dados locais.',error);
    return false;
  }
}

async function loadAll(){
  try{
    const raw = await storageAdapter.get(STORE_KEYS.settings);
    if(raw) state.settings = JSON.parse(raw);
  }catch(e){ console.warn('Não foi possível carregar definições.',e); }
  state.settings = { ...DEFAULT_SETTINGS, ...(state.settings||{}) };
  const loadedServer=await reloadServerData(false);
  if(!loadedServer){
    for (const key of ['vehicles','drivers','entries']){
      try{ const raw=await storageAdapter.get(STORE_KEYS[key]); if(raw) state[key]=JSON.parse(raw); }
      catch(e){ console.warn(`Não foi possível carregar ${key}.`,e); }
    }
  }
}
async function save(key){
  try{
    await storageAdapter.set(STORE_KEYS[key], JSON.stringify(state[key]));
  }catch(e){ toast('Erro ao guardar dados neste navegador.'); console.error(e); }
}

function toast(msg){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  root.appendChild(el);
  setTimeout(()=>el.remove(), 2800);
}

/* ============================================================
   NAVEGAÇÃO
============================================================ */
const NAV_ITEMS = [
  {id:'painel', label:'Visão geral', icon:'grid'},
  {id:'espelho', label:'Espelho da frota', icon:'mirror'},
  {id:'veiculos', label:'Veículos', icon:'car'},
  {id:'motoristas', label:'Motoristas', icon:'user'},
  {id:'registos', label:'Registos', icon:'list'},
  {id:'acertos', label:'Cálculo de ganhos', icon:'calc'},
  {id:'conformidade', label:'Privacidade e dados', icon:'shield'},
  {id:'importar', label:'Importar CSV', icon:'upload'},
  {id:'integracoes', label:'Integrações', icon:'plug'},
];
const ICONS = {
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  car:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13l1.5-5A2 2 0 0 1 6.4 6.5h11.2a2 2 0 0 1 1.9 1.5L21 13"/><rect x="3" y="13" width="18" height="5" rx="1.5"/><circle cx="7.5" cy="18.5" r="1.5"/><circle cx="16.5" cy="18.5" r="1.5"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.3"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>',
  calc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h2M14 11h2M8 15h2M14 15h2M8 19h2M14 19h2"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v5c0 4.6-2.8 8-7 10-4.2-2-7-5.4-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  mirror:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M4 10h16M10 4v16"/></svg>',
  plug:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3v5M15 3v5M7 8h10l-1 5a4 4 0 0 1-4 3.2A4 4 0 0 1 8 13z"/><path d="M12 16.5V21"/></svg>',
};

function renderNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML = NAV_ITEMS.map(item=>`
    <button class="nav-item ${currentView===item.id?'active':''}" data-view="${item.id}">
      ${ICONS[item.icon]} ${item.label}
    </button>`).join('');
  nav.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click', ()=>{ currentView=b.dataset.view; render(); }));
}

const TITLES = {painel:'Visão geral', espelho:'Espelho da frota', veiculos:'Veículos', motoristas:'Motoristas', registos:'Registos', acertos:'Cálculo de ganhos', conformidade:'Privacidade e dados', importar:'Importar CSV', integracoes:'Integrações'};

function render(){
  renderNav();
  document.getElementById('page-title').textContent = TITLES[currentView];
  document.getElementById('topbar-meta').textContent = `${serverDataAvailable?'Base D1':'Dados locais'} · ${state.entries.length} registos`;
  const c=document.getElementById('content');
  c.innerHTML='';
  if(currentView==='painel') renderPainel(c);
  else if(currentView==='espelho') renderEspelho(c);
  else if(currentView==='veiculos') renderVeiculos(c);
  else if(currentView==='motoristas') renderMotoristas(c);
  else if(currentView==='registos') renderRegistos(c);
  else if(currentView==='acertos') renderAcertos(c);
  else if(currentView==='conformidade') renderConformidade(c);
  else if(currentView==='importar') renderImportar(c);
  else if(currentView==='integracoes') renderIntegracoes(c);
}

/* ============================================================
   HELPERS
============================================================ */
function money(v){ return (Number(v)||0).toLocaleString('pt-PT',{minimumFractionDigits:2, maximumFractionDigits:2})+' €'; }
function esc(value){ return String(value??'').replace(/[&<>'"]/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':'&quot;'}[ch])); }
function driverName(id){ const d=state.drivers.find(x=>x.id===id); return d?d.nome:'—'; }
function vehiclePlate(id){ const v=state.vehicles.find(x=>x.id===id); return v?v.matricula:'—'; }
function entryNet(e){ return Number.isFinite(Number(e.liquido)) ? Number(e.liquido) : Number(e.bruto||0)-Number(e.despesas||0); }
function normalizePlate(value){ return String(value||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function boltStatusToLocal(status){ return status==='active'?'Ativo':status==='suspended'?'Parado':status==='deactivated'?'Parado':'Parado'; }
function unixToDate(ts){
  if(!Number.isFinite(Number(ts))) return todayIso();
  try { return new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Lisbon',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(Number(ts)*1000)); }
  catch { return new Date(Number(ts)*1000).toISOString().slice(0,10); }
}
function dateStartTs(date){ return Math.floor(new Date(`${date}T00:00:00`).getTime()/1000); }
function dateEndExclusiveTs(date){ const d=new Date(`${date}T00:00:00`); d.setDate(d.getDate()+1); return Math.floor(d.getTime()/1000); }
function lastNDays(n){
  const out=[]; const today=new Date();
  for(let i=n-1;i>=0;i--){ const d=new Date(today); d.setDate(d.getDate()-i); out.push(d.toISOString().slice(0,10)); }
  return out;
}

/* ============================================================
   VISTA: PAINEL
============================================================ */
async function renderPainel(c){
  const period=state.settings.mirrorPeriod||'this_week';
  c.innerHTML=`
    <div class="hero-grid">
      <div class="hero-card"><div class="hero-eyebrow">Cockpit operacional</div><h2 style="color:#fff">Um espelho real da tua frota.</h2><p style="color:#d9e8ed">Uber e Bolt são normalizadas no mesmo modelo de dados, mantendo sempre a origem identificada. Vê produção, IVA, gorjetas, portagens, acertos e saldos por motorista.</p></div>
      <div class="card"><div class="kpi-label">Período em análise</div><div class="period-bar" style="margin-top:10px">${[['this_week','Esta semana'],['last_week','Semana anterior'],['four_weeks','Últimas 4 semanas'],['quarter','Trimestre'],['year','Ano']].map(([v,l])=>`<button class="period-btn ${period===v?'active':''}" data-period="${v}">${l}</button>`).join('')}</div><div style="font-size:12px;color:var(--text-faint);margin-top:14px">A informação financeira é somada entre plataformas apenas para gestão interna, preservando o detalhe Bolt/Uber.</div></div>
    </div>
    <div id="mirror-overview" style="margin-top:18px"><div class="table-empty">A construir o espelho da frota…</div></div>`;
  c.querySelectorAll('[data-period]').forEach(b=>b.addEventListener('click',async()=>{state.settings.mirrorPeriod=b.dataset.period;await save('settings');render();}));
  try{
    const data=await apiFetch(`/api/analytics/fleet?period=${encodeURIComponent(period)}`); state.fleetMirror=data.mirror; renderFleetOverview(data.mirror);
  }catch(error){document.getElementById('mirror-overview').innerHTML=`<div class="info-card"><b>Não foi possível carregar a visão unificada.</b><br>${esc(error.message)}</div>`;}
}

function renderFleetOverview(m){
  const s=m.summary||{}, drivers=m.drivers||[];
  const bolt=drivers.reduce((a,d)=>a+Number(d.bolt?.platform_payable_cents||0),0);
  const uber=drivers.reduce((a,d)=>a+Number(d.uber?.platform_payable_cents||0),0);
  const top=[...drivers].sort((a,b)=>Number(b.total?.settlementBaseCents||0)-Number(a.total?.settlementBaseCents||0)).slice(0,5);
  const el=document.getElementById('mirror-overview'); if(!el)return;
  el.innerHTML=`<div class="dashboard-layout"><section><div class="kpi-grid compact-kpis">
  <div class="kpi"><div class="kpi-label">Ganhos líquidos</div><div class="kpi-value">${money(Number(s.platformPayableCents||0)/100)}</div><div class="kpi-sub">${Number(s.trips||0)} viagens</div></div>
  <div class="kpi"><div class="kpi-label">IVA apurado</div><div class="kpi-value">${money(Number(s.vatCents||0)/100)}</div><div class="kpi-sub">Sem gorjetas e portagens</div></div>
  <div class="kpi"><div class="kpi-label">Valor após IVA</div><div class="kpi-value">${money(Number(s.settlementBaseCents||0)/100)}</div><div class="kpi-sub">Gorjetas e portagens incluídas</div></div>
  <div class="kpi"><div class="kpi-label">Saldo em aberto</div><div class="kpi-value">${money(Number(s.balanceCents||0)/100)}</div><div class="kpi-sub">Após pagamentos</div></div></div>
  <div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:18px"><div class="card"><div class="section-title" style="margin:0 0 12px">Ganhos por plataforma</div><div class="platform-split"><div class="platform-box"><span class="pill bolt">Bolt</span><strong>${money(bolt/100)}</strong></div><div class="platform-box"><span class="pill uber">Uber</span><strong>${money(uber/100)}</strong></div></div></div><div class="card"><div class="section-title" style="margin:0 0 12px">Componentes</div><div class="metric-row"><div class="metric-mini"><span>Gorjetas</span><b>${money(Number(s.tipsCents||0)/100)}</b></div><div class="metric-mini"><span>Portagens</span><b>${money(Number(s.tollsCents||0)/100)}</b></div><div class="metric-mini"><span>Campanhas</span><b>${money(Number(s.campaignCents||0)/100)}</b></div></div><div class="metric-row"><div class="metric-mini"><span>Reembolsos</span><b>${money(Number(s.reimbursementCents||0)/100)}</b></div><div class="metric-mini"><span>Cancelamentos</span><b>${money(Number(s.cancellationCents||0)/100)}</b></div><div class="metric-mini"><span>Taxas reserva</span><b>${money(Number(s.bookingFeeCents||0)/100)}</b></div></div></div></div></section><aside class="insights-panel"><div class="card"><div class="section-title" style="margin:0 0 14px">Maior produção</div>${top.map((d,i)=>`<div class="ranking-row"><span>${i+1}</span><div><b>${esc(d.name)}</b><small>${Number(d.total?.trips||0)} viagens</small></div><strong>${money(Number(d.total?.settlementBaseCents||0)/100)}</strong></div>`).join('')||'<div class="table-empty">Sem atividade.</div>'}</div><div class="card"><div class="section-title" style="margin:0 0 12px">Estado</div><div class="status-line"><span>Motoristas ativos</span><b>${drivers.length}</b></div><div class="status-line"><span>Com Bolt</span><b>${drivers.filter(d=>Number(d.bolt?.platform_payable_cents||0)>0).length}</b></div><div class="status-line"><span>Com Uber</span><b>${drivers.filter(d=>Number(d.uber?.platform_payable_cents||0)>0).length}</b></div><button class="btn primary" id="open-full-mirror" style="width:100%;margin-top:14px">Abrir espelho completo</button></div></aside></div><div class="section-title">Motoristas</div><div class="driver-grid">${drivers.map(driverCard).join('')||'<div class="table-empty">Ainda não existem motoristas.</div>'}</div>`;
  document.getElementById('open-full-mirror')?.addEventListener('click',()=>{currentView='espelho';render();}); el.querySelectorAll('[data-driver-mirror]').forEach(card=>card.addEventListener('click',()=>openDriverMirror(card.dataset.driverMirror)));
}
function driverCard(d){
  const total=d.total||{}, platformLabels=[Number(d.bolt?.platform_payable_cents||0)>0?'Bolt':'',Number(d.uber?.platform_payable_cents||0)>0?'Uber':''].filter(Boolean).join(' + ')||'Sem atividade';
  return `<article class="driver-card" data-driver-mirror="${esc(d.id)}"><div class="driver-head"><div><div class="driver-name">${esc(d.name)}</div><div class="driver-meta">${esc(platformLabels)} · ${Number(total.trips||0)} viagens</div></div><span class="health-dot ${d.status==='active'?'':'off'}"></span></div><div class="driver-money">${money(Number(total.settlementBaseCents||0)/100)}</div><div style="font-size:11px;color:var(--text-faint)">Base semanal/período para acertos</div><div class="metric-row"><div class="metric-mini"><span>Bolt</span><b>${money(Number(d.bolt?.platform_payable_cents||0)/100)}</b></div><div class="metric-mini"><span>Uber</span><b>${money(Number(d.uber?.platform_payable_cents||0)/100)}</b></div><div class="metric-mini"><span>Saldo</span><b>${money(Number(d.settlement?.balance_cents||0)/100)}</b></div></div></article>`;
}

async function renderEspelho(c){
  const period=state.settings.mirrorPeriod||'this_week';
  c.innerHTML=`<div class="toolbar"><div><div class="section-title" style="margin:0">Espelho consolidado</div><div style="font-size:12px;color:var(--text-faint)">Uma linha por motorista, com rastreabilidade da origem.</div></div><div class="period-bar">${[['this_week','Esta semana'],['last_week','Semana anterior'],['four_weeks','Últimas 4 semanas'],['quarter','Trimestre'],['year','Ano']].map(([v,l])=>`<button class="period-btn ${period===v?'active':''}" data-period="${v}">${l}</button>`).join('')}</div></div><div id="full-mirror"><div class="table-empty">A carregar…</div></div>`;
  c.querySelectorAll('[data-period]').forEach(b=>b.addEventListener('click',async()=>{state.settings.mirrorPeriod=b.dataset.period;await save('settings');render();}));

function browserPreviousMonday(){
  const d=new Date(); const day=d.getDay(); const diff=(day+6)%7;
  d.setDate(d.getDate()-diff-7); return d.toISOString().slice(0,10);
}
function centsEuro(value){ return money(Number(value||0)/100); }
function settlementDirectionLabel(row){
  if(row.balance_direction==='TO_DRIVER') return `Empresa paga ${centsEuro(row.balance_cents)}`;
  if(row.balance_direction==='TO_COMPANY') return `Motorista paga ${centsEuro(Math.abs(row.balance_cents))}`;
  return 'Acertado';
}
function modeLabel(){ return 'Regra TVDE Gest'; }
function chargeTypeLabel(type){ return ({SLOT:'Slot',VEHICLE_RENTAL:'Aluguer de viatura',PERCENTAGE:'Comissão percentual'})[type]||type; }

  document.getElementById('calculate-settlements').addEventListener('click',()=>calculateSettlementsView());

async function loadSettlementsView(){
  const week=document.getElementById('settlement-week')?.value||browserPreviousMonday();
  state.settings.settlementWeekStart=week; await save('settings');
  const log=document.getElementById('settlement-log'); if(log) log.textContent='A carregar acertos e regras…';
  try{
    const [settlementsData,rulesData]=await Promise.all([apiFetch(`/api/settlements?week_start=${encodeURIComponent(week)}`),apiFetch('/api/settlement-rules')]);
    state.settlements=settlementsData.settlements||[]; state.settlementRules=rulesData.rules||[];
    renderSettlementsTable(); renderSettlementRules(); renderAnalysisDriverOptions();
    if(log) log.textContent=`${state.settlements.length} cálculo(s) carregado(s) e ${state.settlementRules.length} regra(s) permanente(s).`;
  }catch(error){ if(log) log.textContent='Erro: '+error.message; document.getElementById('settlements-table').innerHTML=`<div class="empty-state"><p>${esc(error.message)}</p></div>`; }
}

async function calculateSettlementsView(){
  const week=document.getElementById('settlement-week')?.value||browserPreviousMonday();
  const log=document.getElementById('settlement-log'); if(log) log.textContent='A calcular acertos…';
  try{ const data=await apiFetch('/api/settlements/calculate',{method:'POST',body:JSON.stringify({weekStart:week})}); await loadSettlementsView(); const modo=data.platformMode==='BOLT_ONLY'?' apenas com dados Bolt':''; toast(`${data.settlements?.length||0} acerto(s) calculados${modo}.`); }
  catch(error){ if(log) log.textContent='Erro: '+error.message; }

function renderImportar(c){
  c.innerHTML = `

      (na Uber: app → Ganhos → Extrato; na Bolt: app → Ganhos → Exportar). Carrega esse ficheiro aqui para juntar tudo num único registo,
      sem precisar de nenhuma chave de API.
    </div>
    <div class="field" style="max-width:220px; margin-bottom:14px;">
      <label>Plataforma do ficheiro</label>
      <select id="csv-platform"><option>Uber</option><option>Bolt</option></select>
    </div>
    <div class="csv-drop" id="csv-drop">
      ${ICONS.upload.replace('width="16" height="16"','width="26" height="26"')}
      <p style="margin-top:10px;">Arrasta o ficheiro CSV para aqui, ou clica para escolher</p>
      <input type="file" id="csv-input" accept=".csv" class="hidden">
    </div>
    <div id="csv-preview"></div>
  `;
  const drop=document.getElementById('csv-drop'), input=document.getElementById('csv-input');
  drop.addEventListener('click', ()=>input.click());
  drop.addEventListener('dragover', e=>{ e.preventDefault(); drop.classList.add('drag'); });
  drop.addEventListener('dragleave', ()=>drop.classList.remove('drag'));
  drop.addEventListener('drop', e=>{ e.preventDefault(); drop.classList.remove('drag'); if(e.dataTransfer.files[0]) handleCsv(e.dataTransfer.files[0]); });
  input.addEventListener('change', e=>{ if(e.target.files[0]) handleCsv(e.target.files[0]); });
}
let csvParsedRows = [];
function handleCsv(file){
  Papa.parse(file, {
    header:true, skipEmptyLines:true,
    complete: (res)=>{
      csvParsedRows = res.data;
      renderCsvPreview(res.meta.fields||[]);
    },
    error: ()=> toast('Não foi possível ler o ficheiro CSV.'),
  });
}
function renderCsvPreview(fields){
  const wrap = document.getElementById('csv-preview');
  if(csvParsedRows.length===0){ wrap.innerHTML = `<p style="color:var(--text-faint); margin-top:16px;">Ficheiro vazio ou sem linhas reconhecidas.</p>`; return; }
  wrap.innerHTML = `
    <div class="section-title">Associar colunas</div>
    <p style="font-size:12.5px; color:var(--text-dim); margin-bottom:12px;">${csvParsedRows.length} linha(s) encontradas. Indica qual coluna do teu ficheiro corresponde a cada campo.</p>
    <div class="card" style="margin-bottom:16px;">
      <div class="field-row">
        <div class="field"><label>Coluna da data</label><select id="map-data">${fields.map(f=>`<option>${esc(f)}</option>`).join('')}</select></div>
        <div class="field"><label>Coluna do valor (€)</label><select id="map-valor">${fields.map(f=>`<option>${esc(f)}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>Coluna do nº de viagens (opcional)</label><select id="map-viagens"><option value="">— Nenhuma (assume 1 por linha) —</option>${fields.map(f=>`<option>${esc(f)}</option>`).join('')}</select></div>
      <button class="btn primary" id="confirm-import" style="margin-top:6px;">Importar ${csvParsedRows.length} linha(s)</button>
    </div>
  `;
  document.getElementById('confirm-import').addEventListener('click', ()=>{
    const dataCol=document.getElementById('map-data').value;
    const valorCol=document.getElementById('map-valor').value;
    const viagensCol=document.getElementById('map-viagens').value;
    const plataforma=document.getElementById('csv-platform').value;
    let count=0;
    csvParsedRows.forEach(row=>{
      const rawDate=row[dataCol]; const rawValor=row[valorCol];
      if(!rawDate || rawValor===undefined) return;
      const parsedDate = normalizeDate(rawDate);
      const valor = parseFloat(String(rawValor).replace(',','.').replace(/[^\d.-]/g,''));
      if(!parsedDate || isNaN(valor)) return;
      state.entries.push({
        id:uid(), data:parsedDate, plataforma, driverId:'', vehicleId:'',
        viagens: viagensCol ? (Number(row[viagensCol])||1) : 1,
        horas:0, bruto: valor, despesas:0,
      });
      count++;
    });
    save('entries');
    toast(`${count} registo(s) importado(s) com sucesso.`);
    csvParsedRows=[]; render(); currentView='registos'; render();
  });
}
function normalizeDate(str){
  str=String(str).trim();
  let m = str.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/); if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  const d = new Date(str); if(!isNaN(d)) return d.toISOString().slice(0,10);
  return null;
}

  const el=document.getElementById('bolt-sync-log');
  if(!el) return;
  const line=`[${new Date().toLocaleTimeString('pt-PT')}] ${message}`;
  el.textContent=replace?line:`${el.textContent}\n${line}`;
  el.scrollTop=el.scrollHeight;
}

async function runBoltAction(fn){
  try{
    const company=document.getElementById('s-bolt-company')?.value.trim();
    const start=document.getElementById('s-bolt-start')?.value;
    const end=document.getElementById('s-bolt-end')?.value;
    state.settings={...state.settings,boltCompanyId:company,boltStartDate:start,boltEndDate:end};
    await save('settings');
    await fn();
    state.settings.boltLastSync=new Date().toLocaleString('pt-PT');
    await save('settings');
    toast('Sincronização concluída.');
    render();
  }catch(e){ syncLog('Erro: '+e.message); }
}

function boltConfig(){
  const companyId=Number(state.settings.boltCompanyId);
  const startDate=state.settings.boltStartDate;
  const endDate=state.settings.boltEndDate;
  if(!startDate||!endDate) throw new Error('Indica o intervalo de datas.');
  const startTs=dateStartTs(startDate), endTs=dateEndExclusiveTs(endDate);
  if(startTs>=endTs) throw new Error('A data inicial deve ser anterior ou igual à data final.');
  return {companyId,startTs,endTs};
}

async function boltFetch(path, method='GET', body=null){
  boltConfig();
  const options={method,credentials:'include',headers:{Accept:'application/json'}};
  if(body!==null){ options.headers['Content-Type']='application/json'; options.body=JSON.stringify(body); }
  const res=await fetch(path,options);
  const text=await res.text();
  let data; try{ data=JSON.parse(text); }catch{ data=null; }
  if(!res.ok){
    const msg=data?.error?.message||data?.message||text||`HTTP ${res.status}`;
    const boltCode=data?.error?.details?.upstream_response?.code;
    throw new Error(`${msg}${boltCode?` (código Bolt ${boltCode})`:''}`);
  }
  if(!data) throw new Error('O proxy devolveu uma resposta inválida.');
  return data;
}

async function discoverBoltCompany(showLog=true){
  if(showLog) syncLog('A consultar empresas autorizadas…', true);
  const data=await boltFetch('/api/companies','GET');
  const ids=data?.data?.company_ids;
  if(!Array.isArray(ids)||!ids.length) throw new Error('A Bolt não devolveu qualquer company_id.');
  state.settings.boltCompanyId=String(ids[0]);
  await save('settings');
  const input=document.getElementById('s-bolt-company'); if(input) input.value=ids[0];
  syncLog(`Company ID encontrado: ${ids[0]}${ids.length>1?` (${ids.length} empresas disponíveis)`:''}.`);
  return ids[0];
}

async function fetchBoltPages(path, baseBody, listKey, limit, totalKey=null){
  const all=[]; let offset=0; let page=0;
  while(page<100){
    const payload=await boltFetch(path,'POST',{...baseBody,offset,limit});
    const rows=payload?.data?.[listKey];
    if(!Array.isArray(rows)) throw new Error(`A resposta da Bolt não contém data.${listKey}.`);
    all.push(...rows); page++;
    const total=totalKey?Number(payload?.data?.[totalKey]):NaN;
    offset+=rows.length;
    if(rows.length<limit || (Number.isFinite(total)&&offset>=total) || rows.length===0) break;
  }
  if(page>=100) throw new Error('A paginação atingiu o limite de segurança de 100 páginas.');
  return all;
}

function ensureCompanyId(){
  const id=Number(state.settings.boltCompanyId);
  if(!Number.isInteger(id)||id<=0) throw new Error('Descobre ou indica primeiro um company_id válido.');
  return id;
}

function upsertBoltVehicle(v){
  const uuid=v.uuid||null, boltId=v.id??null, plate=v.reg_number||'';
  let existing=state.vehicles.find(x=>(uuid&&x.boltVehicleUuid===uuid)||(boltId!=null&&String(x.boltVehicleId)===String(boltId))||(plate&&normalizePlate(x.matricula)===normalizePlate(plate)));
  const data={
    ...(existing||{}), id:existing?.id||uid(), matricula:plate||existing?.matricula||'Sem matrícula',
    modelo:v.model||existing?.modelo||'', ano:v.year||existing?.ano||'', estado:boltStatusToLocal(v.state),
    driverId:existing?.driverId||'', boltVehicleId:boltId, boltVehicleUuid:uuid, boltState:v.state||'',
    vin:v.vin||existing?.vin||'', lugares:v.seats??existing?.lugares??'', sourceBolt:true,
  };
  if(existing) state.vehicles=state.vehicles.map(x=>x.id===existing.id?data:x); else state.vehicles.push(data);
  return data;
}

function upsertBoltDriver(d){
  const name=[d.first_name,d.last_name].filter(Boolean).join(' ').trim()||d.phone||'Motorista Bolt';
  let existing=state.drivers.find(x=>(d.driver_uuid&&x.boltDriverUuid===d.driver_uuid)||(d.partner_uuid&&x.boltPartnerUuid===d.partner_uuid)||(d.phone&&x.contacto===d.phone));
  let activeVehicle=null;
  if(d.active_vehicle) activeVehicle=upsertBoltVehicle({
    id:d.active_vehicle.id, model:d.active_vehicle.model, year:d.active_vehicle.year,
    reg_number:d.active_vehicle.reg_number, vin:d.active_vehicle.vin, uuid:d.active_vehicle.uuid,
    state:d.active_vehicle.state, seats:null,
  });
  const plataformas=Array.from(new Set([...(existing?.plataformas||[]),'Bolt']));
  const data={
    ...(existing||{}), id:existing?.id||uid(), nome:name, contacto:d.phone||existing?.contacto||'',
    email:d.email||existing?.email||'', vehicleId:activeVehicle?.id||existing?.vehicleId||'', plataformas,
    licenca:existing?.licenca||'', boltDriverUuid:d.driver_uuid||null, boltPartnerUuid:d.partner_uuid||null,
    boltState:d.state||'', rating:d.driver_rating??null, score:d.driver_score??null, sourceBolt:true,
  };
  if(existing) state.drivers=state.drivers.map(x=>x.id===existing.id?data:x); else state.drivers.push(data);
  if(activeVehicle){
    state.vehicles=state.vehicles.map(v=>v.id===activeVehicle.id?{...v,driverId:data.id}:v);
  }
  return data;
}

async function syncBoltDrivers(){
  const {startTs,endTs}=boltConfig(); const companyId=ensureCompanyId();
  syncLog('A sincronizar motoristas…');
  const rows=await fetchBoltPages('/api/drivers',{company_id:companyId,start_ts:startTs,end_ts:endTs},'drivers',1000);
  rows.forEach(upsertBoltDriver);
  await save('drivers'); await save('vehicles');
  syncLog(`${rows.length} motorista(s) recebidos da Bolt.`);
  return rows;
}

async function syncBoltVehicles(){
  const {startTs,endTs}=boltConfig(); const companyId=ensureCompanyId();
  syncLog('A sincronizar veículos…');
  const rows=await fetchBoltPages('/api/vehicles',{company_id:companyId,start_ts:startTs,end_ts:endTs},'vehicles',100);
  rows.forEach(upsertBoltVehicle);
  await save('vehicles');
  syncLog(`${rows.length} veículo(s) recebidos da Bolt.`);
  return rows;
}

function sumNumbers(...values){ return values.reduce((s,v)=>s+(Number.isFinite(Number(v))?Number(v):0),0); }
function findOrCreateOrderDriver(order){
  let driver=state.drivers.find(d=>order.driver_uuid&&d.boltDriverUuid===order.driver_uuid);
  if(!driver&&order.driver_phone) driver=state.drivers.find(d=>d.contacto===order.driver_phone);
  if(!driver){
    driver={id:uid(),nome:order.driver_name||'Motorista Bolt',contacto:order.driver_phone||'',vehicleId:'',plataformas:['Bolt'],licenca:'',boltDriverUuid:order.driver_uuid||null,sourceBolt:true};
    state.drivers.push(driver);
  }
  return driver;
}
function findOrCreateOrderVehicle(order){
  const plate=order.vehicle_license_plate||'';
  let vehicle=state.vehicles.find(v=>plate&&normalizePlate(v.matricula)===normalizePlate(plate));
  if(!vehicle&&plate){
    vehicle={id:uid(),matricula:plate,modelo:order.vehicle_model||'',ano:'',driverId:'',estado:'Ativo',sourceBolt:true};
    state.vehicles.push(vehicle);
  }
  return vehicle||null;
}
function upsertBoltOrder(order){
  const externalId=String(order.order_reference||'');
  if(!externalId) return false;
  const driver=findOrCreateOrderDriver(order), vehicle=findOrCreateOrderVehicle(order);
  const p=order.order_price||{};
  const gross=sumNumbers(p.ride_price,p.booking_fee,p.toll_fee,p.cancellation_fee,p.tip);
  const net=Number.isFinite(Number(p.net_earnings))?Number(p.net_earnings):gross-Math.abs(Number(p.commission||0));
  const expenses=Math.max(0,gross-net);
  const ts=order.payment_confirmed_timestamp||order.order_finished_timestamp||order.order_created_timestamp;
  const data={
    id:uid(), externalId, data:unixToDate(ts), plataforma:'Bolt', driverId:driver.id, vehicleId:vehicle?.id||'',
    viagens:order.order_status==='finished'?1:0, horas:0, bruto:gross, despesas:expenses, liquido:net,
    commission:Number(p.commission||0), tip:Number(p.tip||0), tollFee:Number(p.toll_fee||0),
    status:order.order_status||'', distance:Number(order.ride_distance||0), paymentMethod:order.payment_method||'',
    category:order.category_info?.name||'', source:'Bolt API', updatedAt:new Date().toISOString(),
  };
  const existing=state.entries.find(e=>e.plataforma==='Bolt'&&e.externalId===externalId);
  if(existing){ data.id=existing.id; state.entries=state.entries.map(e=>e.id===existing.id?{...existing,...data}:e); }
  else state.entries.push(data);
  return !existing;
}

async function syncBoltOrders(){
  const {startTs,endTs}=boltConfig(); const companyId=ensureCompanyId();
  syncLog('A sincronizar viagens e valores…');
  const rows=await fetchBoltPages('/api/orders',{
    company_id:companyId, company_ids:[companyId], start_ts:startTs, end_ts:endTs,
    time_range_filter_type:'price_review',
  },'orders',1000,'total_orders');
  let created=0; rows.forEach(order=>{ if(upsertBoltOrder(order)) created++; });
  await save('drivers'); await save('vehicles'); await save('entries');
  syncLog(`${rows.length} viagem(ns) recebida(s): ${created} nova(s), ${rows.length-created} atualizada(s).`);
  return rows;
}

function currentApiTemplates(){
  let companyId=Number(state.settings.boltCompanyId)||0;
  const startTs=dateStartTs(state.settings.boltStartDate||daysAgoIso(7));
  const endTs=dateEndExclusiveTs(state.settings.boltEndDate||todayIso());
  return {
    getCompanies:null,
    test:{company_ids:companyId?[companyId]:[],start_ts:startTs,end_ts:endTs,offset:0,limit:50},
    getDrivers:{company_id:companyId,start_ts:startTs,end_ts:endTs,offset:0,limit:50},
    getVehicles:{company_id:companyId,start_ts:startTs,end_ts:endTs,offset:0,limit:50},
    getFleetOrders:{company_id:companyId,company_ids:companyId?[companyId]:[],start_ts:startTs,end_ts:endTs,time_range_filter_type:'price_review',offset:0,limit:50},
    getFleetStateLogs:{company_id:companyId,start_ts:startTs,end_ts:endTs,offset:0,limit:50},
  };
}

function setupApiExplorer(){
  const select=document.getElementById('api-endpoint');
  const bodyField=document.getElementById('api-body-field');
  const bodyArea=document.getElementById('api-body');
  const responseEl=document.getElementById('api-response');
  function refresh(){
    const isGet=select.selectedOptions[0].dataset.method==='GET';
    bodyField.style.display=isGet?'none':'block';
    const body=currentApiTemplates()[select.value];
    bodyArea.value=body?JSON.stringify(body,null,2):'';
  }
  select.addEventListener('change',refresh); refresh();
  document.getElementById('api-send').addEventListener('click',async()=>{
    responseEl.textContent='A enviar…';
    try{
      const endpoint=select.value, method=select.selectedOptions[0].dataset.method;
      const paths={getCompanies:'/api/companies',test:'/api/test',getDrivers:'/api/drivers',getVehicles:'/api/vehicles',getFleetOrders:'/api/orders',getFleetStateLogs:'/api/state-logs'};
      let body=null;
      if(method==='POST'){
        try{ body=JSON.parse(bodyArea.value||'{}'); }
        catch{ throw new Error('O corpo JSON não é válido.'); }
      }
      const data=await boltFetch(paths[endpoint],method,body);
      responseEl.textContent=JSON.stringify(data,null,2);
    }catch(e){ responseEl.textContent='Erro: '+e.message; }
  });
}

  document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });

function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
function deleteItem(type, id){
  if(!confirm('Apagar este registo?')) return;
  state[type] = state[type].filter(x=>x.id!==id);
  save(type); render();
}

}
