<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071018">
  <title>TVDE Gest</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">TG</div>
        <div><strong>TVDE Gest</strong><span>Fleet Intelligence</span></div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div class="tenant-chip"><span class="status-dot"></span><div><strong>Daniel SC</strong><small>Ambiente principal</small></div></div>
        <button class="icon-button" id="collapse-sidebar" title="Recolher menu">‹</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <button class="mobile-menu" id="mobile-menu" aria-label="Abrir menu">☰</button>
          <div><p id="eyebrow">Cockpit operacional</p><h1 id="page-title">Visão geral</h1></div>
        </div>
        <div class="topbar-actions">
          <div class="period-picker" id="period-picker">
            <button data-period="this_week">Esta semana</button>
            <button data-period="last_week">Anterior</button>
            <button data-period="four_weeks">4 semanas</button>
            <button data-period="quarter">Trimestre</button>
            <button data-period="year" class="active">Ano</button>
            <button data-period="custom">Datas</button>
          </div>
          <button class="button secondary" id="refresh">Atualizar</button>
          <button class="button primary" id="quick-sync">Sincronizar</button>
        </div>
      </header>

      <section class="custom-range hidden" id="custom-range">
        <label>De <input type="date" id="range-start"></label>
        <label>Até <input type="date" id="range-end"></label>
        <button class="button primary" id="apply-range">Aplicar</button>
      </section>

      <div id="page" class="page"><div class="loading-card"><span class="spinner"></span>A carregar o cockpit…</div></div>
    </main>
  </div>

  <div class="toast-stack" id="toasts"></div>
  <dialog id="modal" class="modal"><div id="modal-content"></div></dialog>
</body>
</html>
